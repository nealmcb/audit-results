title: Audit Results 2026
description: >-
  Tracking post-election audits of the November 3, 2026 US general election:
  dates, captures of what states published before each random draw, the audit
  data itself, and requests where volunteers can help.
url: "https://nealmcb.github.io"
baseurl: "/audit-results"
theme: minima
# The site version is FEATURE.N: set "version" by hand when a feature changes, with the time it
# began; N (1 plus the page copies captured since then) is added by scripts/build_site.py.
version: "0.2"
version_since: "2026-11-13T20:24:03Z"
timezone: UTC
permalink: pretty
markdown: kramdown
exclude:
  - neal_ignore/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - README.md
  - scripts/
  - watchlist.json
  - calendar-source.md
  - state-notes/
  - captures/log.jsonl
  - news/
header_pages:
  - calendar.md
  - states/index.md
  - captures.md
  - news.md
  - help-wanted.md
